<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#dfeaf2">
<title>Boston Land Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!--
  Boston Land Rush (Lô Đất Vàng) — V6: Greater Boston bán kính ~35 dặm, ~40 thị trấn, ~500 lô.
  Mua được mọi nhà có sẵn, lô trống và địa danh. Xây theo mẫu nhà / loại hình kinh doanh,
  nâng cấp tới cấp 5. Thu nhập tùy loại hình + vị trí + mật độ dân (công thức ẩn trong ECON).
  Thời gian, giá, thu nhập do máy chủ (Code.gs) quyết định. Song ngữ Anh/Việt.
  File này do build.py ghép từ src/client.html + src/shared.js — sửa ở src/ rồi chạy build.py.
  Hook cho app iPhone (WebView): window.LDV.refresh(), window.LDV.logout(), window.LDV.setLang('vi'|'en')
-->
<style>
  :root{ --ink:#1f2a37; --muted:#6b7280; --card:#fffdf6; --line:#e6e0cf; --green:#0f9d76; --green-d:#0b7a5c; --gold:#f5b82e; --bad:#dc2626; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#dfeaf2;color:var(--ink);overscroll-behavior:none;overflow:hidden}
  body{font-family:'Baloo 2',system-ui,-apple-system,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  button{font-family:inherit;cursor:pointer;color:inherit}
  #scene{position:fixed;inset:0}
  #scene canvas{display:block;width:100%;height:100%;touch-action:none}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;box-shadow:0 4px 14px rgba(31,42,55,.12)}
  .hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
  .hud > *{pointer-events:auto}
  .leftcol{display:flex;flex-direction:column;gap:6px;min-width:0;flex:0 1 auto}
  .wallet{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;min-width:0}
  .wallet .ic{font-size:22px}
  .wallet b{display:block;font-size:20px;line-height:1.05;white-space:nowrap}
  .wallet small{display:block;color:var(--muted);font-size:13px;line-height:1.1;white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
  .clock{padding:4px 12px;font-size:14px;font-weight:700;white-space:nowrap;align-self:flex-start}
  .city{margin-left:auto;padding:6px 12px;text-align:right;line-height:1.1;flex:0 1 auto;min-width:0;overflow:hidden}
  .city b{font-size:16px;white-space:nowrap} .city small{display:block;color:var(--muted);font-size:13px;white-space:nowrap}
  .city .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:4px;vertical-align:1px}
  .city .dot.off{background:var(--bad)}
  .side{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 70px);display:flex;flex-direction:column;gap:8px;z-index:5}
  .rb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:19px;padding:0}
  .mockbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sheetH, 200px) + 66px);background:#fde047;color:#3b2603;font-size:12px;font-weight:700;padding:1px 10px;border-radius:999px;z-index:4;white-space:nowrap}
  .hint{position:fixed;left:10px;right:10px;bottom:calc(var(--sheetH, 200px) + 8px);padding:6px 12px;font-size:14px;color:var(--muted);z-index:4;text-align:center;transition:opacity .4s}
  .collect{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sheetH, 200px) + 10px);z-index:5;border:none;border-radius:999px;
    background:linear-gradient(#fcd34d,#f5b82e);color:#3b2603;box-shadow:0 4px 0 #c98a0b,0 6px 16px rgba(0,0,0,.18);min-height:50px;padding:4px 20px 4px 14px;display:flex;align-items:center;gap:8px;font-family:inherit}
  .collect span{font-size:24px} .collect b{font-size:19px} .collect small{font-size:12px;opacity:.8;max-width:120px;line-height:1.1;text-align:left}
  .collect:active{transform:translateX(-50%) translateY(3px);box-shadow:0 1px 0 #c98a0b}
  .collect:disabled{filter:grayscale(.6);opacity:.75}
  .sheet{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(env(safe-area-inset-bottom) + 8px);z-index:6;display:flex;justify-content:center}
  .sheet .card{width:100%;max-width:620px;padding:10px 10px 8px}
  .row{display:flex;gap:8px;align-items:center}
  .info{flex:1;min-width:0;line-height:1.12;padding-left:4px}
  .info b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info small{color:var(--muted);font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acts{display:flex;gap:6px;margin-top:8px}
  .acts .btn{flex:1}
  .btn{min-height:46px;padding:0 12px;border-radius:14px;border:none;font-weight:800;font-size:15.5px;transition:transform .06s;line-height:1.05}
  .btn small{display:block;font-weight:600;font-size:12px;opacity:.85}
  .btn:active{transform:scale(.96)}
  .btn:disabled{opacity:.45}
  .buy{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d)}
  .rot{background:#eef2f0;border:1.5px solid var(--line)}
  .up{background:#e0edff;border:1.5px solid #bcd3f5;color:#1e3a8a}
  .nav{display:flex;margin-top:8px;border-top:1.5px solid var(--line);padding-top:4px}
  .nav button{flex:1;background:none;border:none;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:600;line-height:1.1}
  .nav button span{font-size:19px}
  .nav i{font-style:normal;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pop{position:fixed;inset:0;background:rgba(31,42,55,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:10px}
  .pop .card{width:100%;max-width:560px;max-height:78vh;display:flex;flex-direction:column;padding:14px;margin-bottom:env(safe-area-inset-bottom)}
  .pop h2{margin:0 0 6px;font-size:21px;display:flex;align-items:center;gap:6px}
  .pop h2 button{margin-left:auto;background:#eef2f0;border:none;border-radius:50%;width:38px;height:38px;font-size:18px;flex:none}
  .list{overflow:auto;font-size:15px}
  .item{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px dashed var(--line)}
  .item:last-child{border:none}
  .item[data-goto],.item[data-town]{cursor:pointer}
  .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none;border:2px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.15)}
  .item .r{margin-left:auto;font-weight:700;white-space:nowrap;text-align:right}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow:auto}
  .grid h3{grid-column:1/-1;margin:6px 0 0;font-size:14px;color:var(--muted)}
  .opt{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.1;min-height:74px}
  .opt span{font-size:24px} .opt b{font-size:13.5px} .opt small{font-size:12px;color:var(--muted)}
  .opt:disabled{opacity:.4}
  .note{font-size:13px;color:var(--muted);margin:6px 2px 0}
  #login{position:fixed;inset:0;background:rgba(223,234,242,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
  #login .card{padding:22px 18px;width:100%;max-width:360px}
  #login h1{margin:0;text-align:center;font-size:34px;color:var(--green-d)}
  #login p{text-align:center;margin:2px 0 14px;color:var(--muted)}
  #login input{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);padding:0 14px;font-family:inherit;font-size:18px;margin-bottom:10px;background:#fff;user-select:text;-webkit-user-select:text}
  #login .btn{width:100%;margin-top:6px}
  .err{color:var(--bad);font-weight:700;text-align:center;min-height:22px;margin-top:6px}
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 100px);transform:translateX(-50%) translateY(-16px);opacity:0;pointer-events:none;
    background:var(--ink);color:#fff;padding:9px 16px;border-radius:14px;font-weight:700;z-index:40;transition:.25s;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.bad{background:var(--bad)} #toast.good{background:var(--green)}
  #loading{position:fixed;inset:0;display:grid;place-items:center;font-size:20px;color:var(--muted);z-index:1}
  .hidden{display:none!important}
  @media (max-width:380px){ .wallet b{font-size:18px} .city b{font-size:15px} .nav button{font-size:12px} }
</style>
</head>
<body>
<div id="loading">…</div>
<div id="scene"></div>

<div class="hud">
  <div class="leftcol">
    <div class="card wallet"><span class="ic">👛</span><div><b id="money">—</b><small id="title"></small></div></div>
    <div class="card clock" id="clock">📅 —</div>
  </div>
  <div class="card city"><b id="place">🇺🇸 Boston, MA</b><small><span class="dot" id="syncDot"></span><span id="online"></span></small></div>
</div>
<div class="side">
  <button class="card rb" id="mapBtn" aria-label="Towns">🗺️</button>
  <button class="card rb" id="homeBtn" aria-label="Home">🎯</button>
  <button class="card rb" id="langBtn" aria-label="Language" style="font-size:13px;font-weight:800"></button>
  <button class="card rb" id="menuBtn" aria-label="Menu">⋯</button>
</div>
<div id="mockbar" class="mockbar hidden" data-t="mock"></div>
<div class="card hint" id="hint" data-t="hint"></div>
<button class="collect hidden" id="collectBtn"><span>💰</span><b id="collectAmt">+$0K</b><small id="collectSub"></small></button>

<div class="sheet" id="sheet">
  <div class="card">
    <div class="row"><div class="info"><b id="selTitle"></b><small id="selSub"></small></div></div>
    <div class="acts" id="acts">
      <button class="btn buy" id="buyBtn"></button>
      <button class="btn rot" id="buildBtn"></button>
      <button class="btn up" id="upBtn"></button>
    </div>
    <div class="nav">
      <button data-pop="rank"><span>📊</span><i data-t="rank"></i></button>
      <button data-pop="log"><span>🧾</span><i data-t="log"></i></button>
      <button data-pop="mine"><span>🏘️</span><i data-t="mine"></i></button>
      <button id="meBtn"><span>👤</span><i id="meName"></i></button>
    </div>
  </div>
</div>

<div id="login">
  <div class="card">
    <h1>Boston Land Rush</h1>
    <p data-t="tagline"></p>
    <input id="uName" data-tp="name" maxlength="16" autocomplete="username">
    <input id="uPass" data-tp="pass" type="password" autocomplete="current-password">
    <button class="btn buy" id="loginBtn" data-t="login"></button>
    <button class="btn rot" id="regBtn" data-t="register"></button>
    <button class="btn rot" id="langBtn2" style="margin-top:10px;min-height:40px;font-size:14px"></button>
    <div class="err" id="loginErr"></div>
  </div>
</div>
<div id="toast"></div>

  var P = 4.4;                         // bước lưới khu phố (3 ô + đường 1.4)
  function hash(s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rnd(seed) { var s = hash(seed) % 2147483646 + 1; return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
  function miles(lat, lon) { return [(lon - LON0) * MLON, (LAT0 - lat) * MLAT]; }   // x: đông, z: nam (dặm)

function mockApi(p){
  return new Promise(res => setTimeout(() => {
    const db = store.get('ldv_mock6', { users: [], parcels: [], gameStart: Date.now() });
    const save = () => store.set('ldv_mock6', db);
    const state = () => ({ ok: true, v: 6, users: db.users.map(u => ({ username: u.username, money: u.money, color: u.color })), parcels: db.parcels.map(o => Object.assign({}, o)), serverTime: Date.now(), gameStart: db.gameStart, speed: ECON.SPEED });
    const fail = (code, extra) => res(Object.assign(state(), { ok: false, code }, extra || {}));
    const name = String(p.username || '').trim().replace(/\s+/g, ' ');
    if (p.action === 'state') return res(state());
    if (p.action === 'register'){
      if (name.length < 2 || name.length > 16) return res({ ok:false, code:'NAME_LEN' });
      if (String(p.password||'').length < 4) return res({ ok:false, code:'PASS_LEN' });
      if (db.users.some(u => u.username.toLowerCase() === name.toLowerCase())) return res({ ok:false, code:'NAME_TAKEN' });
      const u = { username: name, pass: p.password, token: Math.random().toString(36).slice(2), money: START_MONEY, color: MOCK_COLORS[db.users.length % MOCK_COLORS.length] };
      db.users.push(u); save(); return res(Object.assign(state(), { me: { username: u.username, token: u.token } }));
    }
    if (p.action === 'login'){
      const u = db.users.find(u => u.username.toLowerCase() === name.toLowerCase());
      if (!u) return res({ ok:false, code:'NO_USER' });
      if (u.pass !== p.password) return res({ ok:false, code:'BAD_PASS' });
      return res(Object.assign(state(), { me: { username: u.username, token: u.token } }));
    }
    const u = db.users.find(u => u.username === p.username && u.token === p.token);
    if (!u) return res({ ok:false, code:'AUTH' });
    const now = Date.now(), snap = ECON.snapshot(db.parcels);
    if (p.action === 'buy'){
      const parcel = WORLD.byId[p.id]; if (!parcel) return fail('NO_PARCEL');
      const have = db.parcels.find(o => o.id === parcel.id); if (have) return fail('TAKEN', { owner: have.owner });
      const price = ECON.price(parcel, snap); if (u.money < price) return fail('MONEY', { price });
      db.parcels.push({ id: parcel.id, owner: u.username, model: parcel.lm ? 'landmark' : parcel.npc ? parcel.npc.model : 'empty', level: parcel.lm ? 1 : parcel.npc ? parcel.npc.level : 0, paid: price, boughtAt: now, collectedAt: now });
      u.money -= price; save(); return res(Object.assign(state(), { bought: { id: parcel.id, price } }));
    }
    if (p.action === 'build' || p.action === 'upgrade'){
      const o = db.parcels.find(x => x.id === p.id); if (!o || o.owner !== u.username) return fail('NOT_OWNER');
      let cost;
      if (p.action === 'build') {
        if (o.model === 'landmark') return fail('LANDMARK');
        if (ECON.BUILDABLE.indexOf(p.model) < 0) return fail('BAD_MODEL');
        if (o.model === p.model) return fail('SAME_MODEL');
        cost = M[p.model].cost;
      } else {
        if (o.model === 'empty') return fail('EMPTY');
        if (o.level >= ECON.MAX_LEVEL) return fail('MAX_LEVEL');
        cost = ECON.upgradeCost(o.model, o.level, WORLD.byId[o.id]);
      }
      const earned = Math.floor(ECON.pending(o, snap, now));
      if (u.money + earned < cost) return fail('MONEY', { price: cost });
      if (p.action === 'build') { o.model = p.model; o.level = 1; } else o.level++;
      o.paid += cost; o.collectedAt = now; u.money += earned - cost; save();
      return res(Object.assign(state(), p.action === 'build' ? { built: { id: o.id, model: o.model, cost, earned } } : { upgraded: { id: o.id, level: o.level, cost, earned } }));
    }
    if (p.action === 'collect'){
      let total = 0;
      db.parcels.forEach(o => { if (o.owner !== u.username) return; total += ECON.pending(o, snap, now); o.collectedAt = now; });
      const amount = Math.floor(total); u.money += amount; save();
      return res(Object.assign(state(), { collected: amount }));
    }
    res({ ok:false, code:'BAD_CMD' });
  }, 150 + Math.random() * 200));
}
async function api(p){
  if (!API_URL) return mockApi(p);
  // text/plain để Apps Script không bị chặn CORS (không có preflight)
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(p), redirect: 'follow' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

}

    const p = S.sel && WORLD.byId[S.sel];
    if (!p) { selMesh.visible = false; return; }
    selMesh.visible = true; selMesh.position.set(p.x, .15, p.z); const w = p.lm ? 3.2 : .98; selMesh.scale.set(w, 1, w);
    const o = S.owned[p.id];
    selMat.color.set(!o ? '#22c55e' : (S.me && o.owner === S.me.username) ? '#3b82f6' : '#ef4444');
  }

  /* ---------- xe chạy trên cao tốc ---------- */
  const cars = [];
  const carCols = ['#ef4444', '#f8fafc', '#3b82f6', '#facc15', '#111827', '#10b981'];
  highways.forEach((pts, hi) => {
    for (let k = 0; k < 3; k++) {
      const g = new THREE.Group(); box(.5, .16, .25, Mt(carCols[(hi + k) % carCols.length]), 0, .03, 0, g); box(.28, .12, .22, Mt('#dbeafe'), -.03, .19, 0, g);
      world.add(g); cars.push({ g, pts, u: (k / 3 + hi * .13) % 1, v: .006 + (k % 2) * .003, dir: k % 2 ? 1 : -1 });
    }
  });
  const segLen = pts => { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; };
  cars.forEach(c => c.L = segLen(c.pts));
  function carPos(c){
    let d = c.u * c.L;
    for (let i = 1; i < c.pts.length; i++) {
      const a = c.pts[i - 1], b = c.pts[i], l = Math.hypot(b[0] - a[0], b[1] - a[1]);
      if (d <= l) { const k = d / l, nx = (b[0] - a[0]) / l, nz = (b[1] - a[1]) / l, off = c.dir * .2;
        return [a[0] + (b[0] - a[0]) * k - nz * off, a[1] + (b[1] - a[1]) * k + nx * off, Math.atan2(-(b[1] - a[1]), b[0] - a[0]) + (c.dir < 0 ? Math.PI : 0)]; }
      d -= l;
    }
    const e = c.pts[c.pts.length - 1]; return [e[0], e[1], 0];
  }

  /* ---------- camera + điều khiển ---------- */
  const cam = { tx: 0, tz: 1, dist: 34, yaw: Math.PI / 4, pitch: .92 };
  function updateCamera(){
    cam.dist = Math.max(6, Math.min(230, cam.dist));
    const lim = 95; cam.tx = Math.max(-lim, Math.min(lim, cam.tx)); cam.tz = Math.max(-lim, Math.min(lim, cam.tz));
    cam.pitch = .78 + Math.min(.4, cam.dist / 400);
    scene.fog.near = cam.dist * 1.2; scene.fog.far = cam.dist * 3;
    const h = Math.sin(cam.pitch) * cam.dist, r = Math.cos(cam.pitch) * cam.dist;
    camera.position.set(cam.tx + Math.sin(cam.yaw) * r, h, cam.tz + Math.cos(cam.yaw) * r);
    camera.lookAt(cam.tx, 0, cam.tz);
    sun.position.set(cam.tx - 14, 26, cam.tz + 10); sun.target.position.set(cam.tx, 0, cam.tz);
    sun.castShadow = cam.dist < 70;
    const ls = Math.max(1, Math.pow(cam.dist / 40, .7)), far = cam.dist > 55;
    townLabels.forEach(sp => {
      sp.visible = sp.userData.city ? far : !(far && sp.userData.hood);
      sp.scale.set(sp.userData.lbl0w * ls, sp.userData.lbl0h * ls, 1); sp.position.y = 5.5 * Math.max(1, ls * .8);
    });
  }
  townLabels.forEach(sp => { sp.userData.lbl0w = sp.scale.x; sp.userData.lbl0h = sp.scale.y; });
  function resize(){
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    document.documentElement.style.setProperty('--sheetH', $('sheet').offsetHeight + 'px');
    camera.setViewOffset(w, h, 0, ($('sheet').offsetHeight - 70) * .45, w, h);
  }
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -.1);
  function setRay(px, py){ ndc.set(px / innerWidth * 2 - 1, -(py / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); }
  function groundAt(px, py){ setRay(px, py); const p = new THREE.Vector3(); return ray.ray.intersectPlane(plane, p) ? p : null; }
  function pickParcel(px, py){
    setRay(px, py);
    const targets = [...[...ownedObjs.values()].map(o => o.group), ...Object.values(lmGroups), bodyI, roofI, tileI];
    const hits = ray.intersectObjects(targets, true);
    for (const h of hits) {
      if (h.object.userData.pid) return h.object.userData.pid;
      if (h.object === bodyI || h.object === roofI) { const p = npcLots[h.instanceId]; if (p && !npcHidden[p.id]) return p.id; }
      if (h.object === tileI) return lots[h.instanceId].id;
    }
    return null;
  }
  const el = renderer.domElement, ptrs = new Map(); let drag = null, multi = null;
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch(_){}
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 1) drag = { start: [e.clientX, e.clientY], last: [e.clientX, e.clientY], moved: false, rotate: e.button === 2 || e.shiftKey };
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; multi = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), ang: Math.atan2(b[1] - a[1], b[0] - a[0]) }; drag = null; }
    hideHint();
  });
  el.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (multi && ptrs.size >= 2) {
      const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
      cam.dist *= multi.d / d; cam.yaw -= ang - multi.ang; multi.d = d; multi.ang = ang; updateCamera();
    } else if (drag) {
      const p = [e.clientX, e.clientY];
      if (!drag.moved && Math.hypot(p[0] - drag.start[0], p[1] - drag.start[1]) > 8) drag.moved = true;
      if (drag.moved) {
        if (drag.rotate) cam.yaw -= (p[0] - drag.last[0]) * .008;
        else { const a = groundAt(drag.last[0], drag.last[1]), b = groundAt(p[0], p[1]); if (a && b) { cam.tx += a.x - b.x; cam.tz += a.z - b.z; } }
        updateCamera();
      }
      drag.last = p;
    }
  });
  const endPtr = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (drag && !drag.moved && ptrs.size === 0 && e.type === 'pointerup') onTap(pickParcel(drag.start[0], drag.start[1]));
    if (ptrs.size < 2) multi = null;
    if (ptrs.size === 0) drag = null;
  };
  el.addEventListener('pointerup', endPtr); el.addEventListener('pointercancel', endPtr);
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('wheel', e => { e.preventDefault(); cam.dist *= e.deltaY > 0 ? 1.1 : 1 / 1.1; updateCamera(); hideHint(); }, { passive: false });

  let fly = null;
  function flyTo(x, z, dist){ fly = { x0: cam.tx, z0: cam.tz, d0: cam.dist, x, z, d: dist || 14, t0: performance.now() }; }

  /* ---------- vòng lặp ---------- */
  const easeBack = k => { const c = 1.7; k = Math.min(1, k) - 1; return 1 + (c + 1) * k * k * k + c * k * k; };
  let lastT = performance.now();
  function loop(now){
    const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
    if (fly) {
      const k = Math.min(1, (now - fly.t0) / 900), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      cam.tx = fly.x0 + (fly.x - fly.x0) * e; cam.tz = fly.z0 + (fly.z - fly.z0) * e; cam.dist = fly.d0 + (fly.d - fly.d0) * e; updateCamera();
      if (k >= 1) fly = null;
    }
    cars.forEach(c => { c.u = (c.u + c.v * dt * c.dir + 1) % 1; const [x, z, r] = carPos(c); c.g.position.set(x, 0, z); c.g.rotation.y = r; });
    for (const ob of ownedObjs.values()) {
      if (ob.born) { const k = (now - ob.born) / 700; if (k >= 1) { ob.born = 0; ob.group.scale.set(1, 1, 1); } else ob.group.scale.set(1, Math.max(.02, easeBack(k)), 1); }
      const c = ob.group.userData.coin; if (c && c.visible) c.position.y = c.userData.baseY + Math.abs(Math.sin(now / 300 + ob.group.id)) * .25;
    }
    selMat.opacity = .35 + Math.sin(now / 300) * .12;
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  resize(); updateCamera();
  window.addEventListener('resize', () => { resize(); updateCamera(); });
  if (window.ResizeObserver) new ResizeObserver(() => resize()).observe($('sheet'));
  requestAnimationFrame(loop);
  $('loading').classList.add('hidden');
  cityReady = true;
  return {
    sync, syncSelection, syncCoins, resize, flyTo, cam, updateCamera,
    relabel(){ labels.forEach(drawLabel); townLabels.forEach(sp => { sp.userData.lbl0w = sp.scale.x; sp.userData.lbl0h = sp.scale.y; }); updateCamera(); for (const ob of ownedObjs.values()) ob.sig = ''; sync(); },
    rebuild(){ for (const ob of ownedObjs.values()) ob.sig = ''; sync(); },
    screenOf(x, z){ const v = new THREE.Vector3(x, .15, z).project(camera); return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight]; },
    nearestTown(){ let best = null, bd = 1e9; WORLD.towns.forEach(tw => { const d = Math.hypot(tw.x - cam.tx, tw.z - cam.tz); if (d < bd) { bd = d; best = tw; } }); return { town: best, d: bd }; }
  };
})();

/* ====== chọn lô ====== */
function onTap(id){
  if (!id) { if (S.sel) { S.sel = null; City.syncSelection(); renderUI(); } return; }
  S.sel = id; sfx.tap(); City.syncSelection(); renderUI();
}

/* ====== hành động (máy chủ tính giá, thời gian, thu nhập) ====== */
async function act(payload, onOk){
  if (!S.me || S.busy) return;
  S.busy = true; renderUI();
  try {
    const r = await api(Object.assign({ username: S.me.username, token: S.me.token }, payload));
    S.busy = false;
    if (r.ok) { applyState(r); onOk(r); }
    else { if (r.code === 'AUTH') logout(); applyState(r); toast(errText(r), 'bad'); sfx.bad(); }
  } catch (e) { S.busy = false; toast(t('lost'), 'bad'); sfx.bad(); }
  renderUI();
}
function buy(){
  const p = S.sel && WORLD.byId[S.sel]; if (!p || S.owned[p.id]) return;
  act({ action: 'buy', id: p.id }, r => { toast(t('bought', { name: parcelName(p), price: fmt(r.bought.price) }), 'good'); sfx.ok(); });
}
function build(model){
  const p = S.sel && WORLD.byId[S.sel]; if (!p) return;
  closePop();
  act({ action: 'build', id: p.id, model }, r => { toast(t('builtT', { model: modelName(model), price: fmt(r.built.cost) }), 'good'); sfx.ok(); });
}
function upgrade(){
  const p = S.sel && WORLD.byId[S.sel]; if (!p) return;
  act({ action: 'upgrade', id: p.id }, r => { toast(t('upT', { lv: r.upgraded.level, price: fmt(r.upgraded.cost) }), 'good'); sfx.ok(); });
}
function collect(){
  act({ action: 'collect' }, r => { if (r.collected > 0) { toast(t('collected', { money: fmt(r.collected) }), 'good'); sfx.coin(); } else toast(t('nothing')); });
}

/* ====== giao diện ====== */
function renderUI(){
  const me = meUser(), mine = myParcels();
  $('money').textContent = me ? fmt(me.money) : '—';
  const inc = mine.reduce((a, o) => a + incomeOf(o), 0);
  const rankT = mine.length >= 8 ? 't3' : mine.length >= 3 ? 't2' : mine.length ? 't1' : 't0';
  $('title').textContent = t(rankT) + (mine.length ? ' · 📈 ' + t('perDay', { money: fmt(inc) }) : '');
  $('meName').textContent = S.me ? S.me.username : t('profile');
  $('langBtn').textContent = LANG === 'vi' ? 'EN' : 'VI'; $('langBtn2').textContent = t('lang');
  const ago = S.lastSync ? Math.round((Date.now() - S.lastSync) / 1000) : null;
  $('online').textContent = !S.online ? t('offline') : ago == null ? t('connecting') : t('players', { n: S.users.length }) + (ago > 20 ? ' · ' + ago + 's' : '');
  $('syncDot').classList.toggle('off', !S.online);
  if (cityReady) {
    const nt = City.nearestTown();
    if (nt.town && nt.d < 14 && City.cam.dist < 90) {
      const pop = S.snap.pop[nt.town.code], g = Math.round((pop / nt.town.a.pop - 1) * 100);
      $('place').textContent = '📍 ' + townName(nt.town.code) + ' · ' + t('pop', { n: pop.toFixed(1) }) + (g > 0 ? ' ↑' : '');
    } else $('place').textContent = '🇺🇸 Greater Boston';
  }
  // đồng hồ game (theo máy chủ)
  if (S.gameStart) {
    const gd = new Date(Date.UTC(2026, 0, 1) + (serverNow() - S.gameStart) * ECON.SPEED);
    const dd = String(gd.getUTCDate()).padStart(2, '0'), mm = String(gd.getUTCMonth() + 1).padStart(2, '0');
    const hh = String(gd.getUTCHours()).padStart(2, '0'), mi = String(gd.getUTCMinutes()).padStart(2, '0');
    const dayIdx = Math.floor((serverNow() - S.gameStart) / ECON.DAY_MS), winter = [11, 0, 1].includes(gd.getUTCMonth());
    const wx = (winter ? ['sunny', 'cloudy', 'snow', 'snow'] : ['sunny', 'sunny', 'cloudy', 'rain'])[hashN('w' + dayIdx) % 4];
    $('clock').textContent = `📅 ${LANG === 'vi' ? dd + '/' + mm : mm + '/' + dd}/${gd.getUTCFullYear()} · ${hh}:${mi} · ${t(wx)}`;

  // lô đang chọn
  const p = S.sel && WORLD.byId[S.sel], buyB = $('buyBtn'), buildB = $('buildBtn'), upB = $('upBtn');
  if (!p) {
    $('selTitle').textContent = t('pickTitle'); $('selSub').textContent = t('pickSub');
    $('acts').classList.add('hidden');
  } else {
    $('acts').classList.remove('hidden');
    const o = S.owned[p.id], mineSel = o && S.me && o.owner === S.me.username;
    const model = o ? o.model : p.lm ? 'landmark' : p.npc ? p.npc.model : 'empty', lv = o ? o.level : p.npc ? p.npc.level : 1;
    const icon = p.lm ? '⭐' : (M[model] ? M[model].icon : '🟩');
    $('selTitle').textContent = `${icon} ${parcelName(p)}`;
    const parts = [model === 'empty' ? t('empty') : (p.lm ? modelName('landmark') : modelName(model)) + ' · ' + t('lvl', { lv })];
    if (!o) parts.push(t('unowned'), t('priceIs', { price: fmt(ECON.price(p, S.snap)) }));
    else if (mineSel) parts.push(model === 'empty' ? t('emptyMine') : t('incomeMine', { money: fmt(incomeOf(o)) }));
    else parts.push(t('owner', { owner: o.owner }));
    if (!mineSel && !o) parts.push(t('incomeHidden'));
    $('selSub').textContent = parts.join(' · ');
    buyB.classList.toggle('hidden', !!o); buildB.classList.toggle('hidden', !mineSel || model === 'landmark'); upB.classList.toggle('hidden', !mineSel || model === 'empty');
    buyB.innerHTML = `${t(S.busy ? 'buying' : 'buy')}<small>${fmt(ECON.price(p, S.snap))}</small>`;
    buyB.disabled = S.busy || !S.me;
    buildB.innerHTML = `🏗️ ${t('build')}`; buildB.disabled = S.busy;
    if (mineSel && model !== 'empty') {
      const maxed = lv >= ECON.MAX_LEVEL;
      upB.innerHTML = maxed ? t('maxed') : `⬆️ ${t('upgrade')} ${lv + 1}<small>${fmt(ECON.upgradeCost(model, lv, p))}</small>`;
      upB.disabled = S.busy || maxed;

  }
}

  if (kind === 'rank') {
    const rows = S.users.map(u => {
      const ps = S.parcels.filter(o => o.owner === u.username);
      return { u, n: ps.length, inc: ps.reduce((s, o) => s + incomeOf(o), 0), total: u.money + ps.reduce((s, o) => s + (o.paid || 0), 0) };
    }).sort((a, b) => b.total - a.total);

}
let hintGone = false;
function hideHint(){ if (hintGone) return; hintGone = true; setTimeout(() => $('hint').style.opacity = 0, 1500); setTimeout(() => $('hint').classList.add('hidden'), 2000); }

$('buyBtn').addEventListener('click', buy);
$('buildBtn').addEventListener('click', showBuild);
$('upBtn').addEventListener('click', upgrade);
$('collectBtn').addEventListener('click', collect);
function showHowto(){ makePop(t('howto'), `<div class="list" style="line-height:1.35">${t('howtoBody')}</div>`); }
function showMenu(){
  const d = makePop(`👤 ${S.me ? esc(S.me.username) : t('settings')}`, `
    <button class="btn rot" id="mHow" style="margin-bottom:8px">${t('howto')}</button>
    <button class="btn rot" id="mLang" style="margin-bottom:8px">${t('lang')}</button>
    <button class="btn rot" id="mMute" style="margin-bottom:8px">${t(muted ? 'soundOn' : 'soundOff')}</button>
    <button class="btn rot" id="mOut">${t('logout')}</button>`);
  $('mMute').onclick = () => { muted = !muted; store.set('ldv_muted', muted); closePop(); };
  $('mOut').onclick = () => { closePop(); logout(); };
  $('mLang').onclick = () => { closePop(); setLang(LANG === 'vi' ? 'en' : 'vi'); };
  $('mHow').onclick = showHowto;
}
$('menuBtn').addEventListener('click', showMenu);
$('meBtn').addEventListener('click', showMenu);
$('langBtn').addEventListener('click', () => setLang(LANG === 'vi' ? 'en' : 'vi'));
$('langBtn2').addEventListener('click', () => setLang(LANG === 'vi' ? 'en' : 'vi'));

/* ====== đăng nhập ====== */
async function auth(action){
  const username = $('uName').value.trim(), password = $('uPass').value;
  $('loginErr').textContent = '';
  if (!username || !password) { $('loginErr').textContent = t('needBoth'); return; }
  $('loginBtn').disabled = $('regBtn').disabled = true;
  try {
    const r = await api({ action, username, password });
    if (!r.ok) { $('loginErr').textContent = errText(r); sfx.bad(); }
    else {
      S.me = r.me; store.set('ldv_me', r.me);
      $('login').classList.add('hidden'); $('uPass').value = '';
      applyState(r); City.rebuild(); sfx.ok();
      toast(action === 'register' ? t('welcomeNew', { name: r.me.username, money: fmt(START_MONEY) }) : t('welcomeBack', { name: r.me.username }), 'good');
      if (action === 'register') setTimeout(showHowto, 900);
    }
  } catch (e) { $('loginErr').textContent = t('noServer'); }
  $('loginBtn').disabled = $('regBtn').disabled = false;
}
$('loginBtn').addEventListener('click', () => auth('login'));
$('regBtn').addEventListener('click', () => auth('register'));
$('uPass').addEventListener('keydown', e => { if (e.key === 'Enter') auth('login'); });
function logout(){
  S.me = null; store.del('ldv_me'); S.sel = null;
  $('login').classList.remove('hidden'); City.rebuild(); City.syncSelection(); renderUI();
}
window.addEventListener('keydown', e => { if (e.key === 'Escape') { S.sel = null; City.syncSelection(); renderUI(); closePop(); } });
document.addEventListener('gesturestart', e => e.preventDefault());

/* ====== khởi động ====== */
window.LDV = { refresh, logout, setLang };
applyStaticText();
if (!API_URL) $('mockbar').classList.remove('hidden');
if (S.me) $('login').classList.add('hidden');
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => City.relabel());
renderUI(); City.resize(); refresh();
setInterval(() => { if (!document.hidden && S.me) refresh(); }, POLL_MS);
setInterval(renderUI, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
