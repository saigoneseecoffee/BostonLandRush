<!--
  Boston Land Rush (Lô Đất Vàng) — V5: đồng hồ game theo máy chủ, thu nhập theo ngày game, hiệu ứng láng giềng · song ngữ Anh/Việt · Boston 3D
  Game bất động sản online: khu Đất Vàng gồm 3x3 khu phố, mỗi khu 3x3 ô (tổng 9x9 ô).
  Mỗi người mua lô 2x1 nằm gọn trong một khu phố, ai mua trước thì được.
  Dữ liệu lưu trên Google Sheet qua Apps Script (file Code.gs).
  Để trống API_URL thì game chạy "chế độ thử" lưu trong máy (không online).
  Hook cho app iPhone (WebView): window.LDV.refresh(), window.LDV.logout()
-->
<style>
  :root{ --ink:#1f2a37; --muted:#6b7280; --card:#fffdf6; --line:#e6e0cf; --green:#0f9d76; --green-d:#0b7a5c;
    --gold:#f5b82e; --bad:#dc2626; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#dfeaf2;color:var(--ink);overscroll-behavior:none;overflow:hidden}
  body{font-family:'Baloo 2',system-ui,-apple-system,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  button{font-family:inherit;cursor:pointer;color:inherit}
  #scene{position:fixed;inset:0}
  #scene canvas{display:block;width:100%;height:100%;touch-action:none}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;box-shadow:0 4px 14px rgba(31,42,55,.12)}
  .hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
  .hud > *{pointer-events:auto}
  .wallet{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;min-width:0}
  .wallet .ic{font-size:22px}
  .wallet b{display:block;font-size:20px;line-height:1.05;white-space:nowrap}
  .wallet small{display:block;max-width:44vw;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:13px;line-height:1.1;white-space:nowrap}
  .wallet{flex:0 1 auto} .city{flex:0 1 auto;min-width:0;overflow:hidden}
  .city{margin-left:auto;padding:6px 12px;text-align:right;line-height:1.1}
  .city b{font-size:16px;white-space:nowrap} .city small{display:block;color:var(--muted);font-size:13px;white-space:nowrap}
  .city .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:4px;vertical-align:1px}
  .city .dot.off{background:var(--bad)}
  .side{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 70px);display:flex;flex-direction:column;gap:8px;z-index:5}
  .rb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:19px;padding:0}
  .rb.on{background:var(--gold);border-color:#c98a0b}
  .mockbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 66px);background:#fde047;color:#3b2603;font-size:12px;font-weight:700;padding:1px 10px;border-radius:999px;z-index:4;white-space:nowrap}
  .leftcol{display:flex;flex-direction:column;gap:6px;min-width:0}
  .clock{padding:4px 12px;font-size:14px;font-weight:700;white-space:nowrap;align-self:flex-start}
  .collect{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sheetH, 200px) + 10px);z-index:5;border:none;border-radius:999px;
    background:linear-gradient(#fcd34d,#f5b82e);color:#3b2603;box-shadow:0 4px 0 #c98a0b,0 6px 16px rgba(0,0,0,.18);min-height:50px;padding:4px 20px 4px 14px;display:flex;align-items:center;gap:8px;font-family:inherit}
  .collect span{font-size:24px} .collect b{font-size:19px} .collect small{font-size:12px;opacity:.8;max-width:120px;line-height:1.1;text-align:left}
  .collect:active{transform:translateX(-50%) translateY(3px);box-shadow:0 1px 0 #c98a0b}
  .collect:disabled{filter:grayscale(.6);opacity:.75}
  .hint{position:fixed;left:10px;right:10px;bottom:calc(var(--sheetH, 200px) + 8px);padding:6px 12px;font-size:14px;color:var(--muted);z-index:4;text-align:center;transition:opacity .4s}
  .sheet{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(env(safe-area-inset-bottom) + 8px);z-index:6;display:flex;justify-content:center}
  .sheet .card{width:100%;max-width:620px;padding:10px 10px 8px}
  .row{display:flex;gap:8px;align-items:center}
  .info{flex:1;min-width:0;line-height:1.12;padding-left:4px}
  .info b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info small{color:var(--muted);font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{min-height:46px;padding:0 14px;border-radius:14px;border:none;font-weight:800;font-size:16px;transition:transform .06s}
  .btn:active{transform:scale(.96)}
  .btn:disabled{opacity:.45}
  .buy{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d)}
  .rot{background:#eef2f0;border:1.5px solid var(--line)}
  .kinds{display:flex;gap:6px;margin-top:8px}
  .kind{flex:1;min-width:0;min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:#fff;display:grid;grid-template-columns:auto 1fr;column-gap:5px;align-items:center;text-align:left;padding:3px 7px;line-height:1.05}
  .kind span{grid-row:1/3;font-size:21px}
  .kind b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .kind small{font-size:12px;color:var(--muted)}
  .kind.on{background:#e3f5ee;border-color:var(--green);box-shadow:inset 0 0 0 1.5px var(--green)}
  .nav{display:flex;margin-top:8px;border-top:1.5px solid var(--line);padding-top:4px}
  .nav button{flex:1;background:none;border:none;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:600;line-height:1.1}
  .nav button span{font-size:19px}
  .pop{position:fixed;inset:0;background:rgba(31,42,55,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:10px}
  .pop .card{width:100%;max-width:520px;max-height:70vh;display:flex;flex-direction:column;padding:14px;margin-bottom:env(safe-area-inset-bottom)}
  .pop h2{margin:0 0 6px;font-size:22px;display:flex;align-items:center}
  .pop h2 button{margin-left:auto;background:#eef2f0;border:none;border-radius:50%;width:38px;height:38px;font-size:18px}
  .list{overflow:auto;font-size:15px}
  .item{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px dashed var(--line)}
  .item:last-child{border:none}
  .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none;border:2px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.15)}

  #login .btn{width:100%;margin-top:6px}
  .err{color:var(--bad);font-weight:700;text-align:center;min-height:22px;margin-top:6px}
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 92px);transform:translateX(-50%) translateY(-16px);opacity:0;pointer-events:none;
    background:var(--ink);color:#fff;padding:9px 16px;border-radius:14px;font-weight:700;z-index:40;transition:.25s;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.bad{background:var(--bad)} #toast.good{background:var(--green)}
  #loading{position:fixed;inset:0;display:grid;place-items:center;font-size:20px;color:var(--muted);z-index:1}
  .hidden{display:none!important}
  @media (max-width:380px){ .wallet b{font-size:18px} .city b{font-size:15px} .nav button{font-size:12px} }

<div class="hud">

  <button class="card rb" id="langBtn" aria-label="Language" style="font-size:13px;font-weight:800"></button>

<div id="mockbar" class="mockbar hidden" data-t="mock"></div>

<button class="collect hidden" id="collectBtn"><span>💰</span><b id="collectAmt">+$0K</b><small id="collectSub"></small></button>

<div class="sheet" id="sheet">
  <div class="card">
    <div class="row">
      <div class="info"><b id="selTitle">Chạm vào ô đất để chọn lô</b><small id="selSub">Mỗi lô gồm 2 ô liền nhau trong cùng khu phố</small></div>
      <button class="btn rot" id="rotBtn" aria-label="Xoay lô">↻ Ngang</button>
      <button class="btn buy" id="buyBtn" disabled>Mua</button>
    </div>
    <div class="kinds">
      <button class="kind on" data-k="house"><span>🏠</span><b data-t="house"></b><small>+$50K</small></button>
      <button class="kind" data-k="shop"><span>🏪</span><b data-t="shop"></b><small>+$120K</small></button>
      <button class="kind" data-k="tower"><span>🏢</span><b data-t="tower"></b><small>+$250K</small></button>
    </div>
    <div class="nav">
      <button data-pop="rank"><span>📊</span><i data-t="rank" style="font-style:normal"></i></button>
      <button data-pop="log"><span>🧾</span><i data-t="log" style="font-style:normal"></i></button>
      <button data-pop="mine"><span>🏘️</span><i data-t="mine" style="font-style:normal"></i></button>
      <button id="meBtn"><span>👤</span><i id="meName" style="font-style:normal">Hồ sơ</i></button>
    </div>
  </div>
</div>

<div id="login">
  <div class="card">
    <h1>Boston Land Rush</h1>
    <p data-t="tagline"></p>
    <input id="uName" data-tp="name" placeholder="" maxlength="16" autocomplete="username">
    <input id="uPass" data-tp="pass" placeholder="" type="password" autocomplete="current-password">
    <button class="btn buy" id="loginBtn" data-t="login"></button>
    <button class="btn rot" id="regBtn" data-t="register"></button>
    <button class="btn rot" id="langBtn2" style="margin-top:10px;min-height:40px;font-size:14px"></button>
    <div class="err" id="loginErr"></div>
  </div>
</div>
<div id="toast"></div>

  return vars ? v.replace(/\{(\w+)\}/g, (_, k) => vars[k] != null ? vars[k] : '') : v;
}

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(_){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} },
  del(k){ try{ localStorage.removeItem(k); }catch(_){} }
};
const cellPrice = (x, y) => 100 + 50 * (4 - Math.max(Math.abs(x - 4), Math.abs(y - 4)));
const cellsOf = (x, y, dir) => dir === 'v' ? [[x, y], [x, y + 1]] : [[x, y], [x + 1, y]];
const sameBlock = (x, y, dir) => { const c = cellsOf(x, y, dir); return Math.floor(c[0][0] / 3) === Math.floor(c[1][0] / 3) && Math.floor(c[0][1] / 3) === Math.floor(c[1][1] / 3); };
const fmt = n => { n = Number(n); return n >= 1000 ? '$' + (n / 1000).toLocaleString('en-US', { maximumFractionDigits: 2 }) + 'M' : '$' + (Number.isInteger(n) ? n : n.toFixed(n < 100 ? 1 : 0)) + 'K'; };
const lotName = (x, y, dir) => cellsOf(x, y, dir).map(c => COLS[c[0]] + (c[1] + 1)).join('–');
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const hashN = s => { let h = 7; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); };

/* ====== KINH TẾ (giống hệt Code.gs — máy chủ mới là nơi tính thật) ====== */
const SPEED = 24, DAY_MS = 86400000 / SPEED, CAP_DAYS = 12;
const RATE = { house: 10, shop: 16, tower: 28 };
function neighborsOf(l, lots){
  const mine = {}; cellsOf(l.x, l.y, l.dir).forEach(c => mine[c] = 1);
  return lots.filter(o => o.id !== l.id && cellsOf(o.x, o.y, o.dir).some(c => [[1, 0], [-1, 0], [0, 1], [0, -1]].some(d => mine[[c[0] + d[0], c[1] + d[1]]])));
}
function lotRate(l, lots){
  const nb = neighborsOf(l, lots), count = k => nb.filter(o => o.kind === k).length;
  if (l.kind === 'shop') return RATE.shop + 4 * Math.min(4, count('house'));
  if (l.kind === 'tower') return RATE.tower + 6 * Math.min(3, count('tower'));
  return RATE.house + 2 * Math.min(3, count('shop'));
}

/* ====== máy chủ thử (giống luật trong Code.gs) ====== */
const MOCK_COLORS = ['#e94f37','#3b82f6','#22c55e','#f59e0b','#a855f7','#ec4899','#14b8a6','#f97316'];
function mockApi(p){
  return new Promise(res => setTimeout(() => {
    const db = store.get('ldv_mock', { users: [], lots: [] });
    if (!db.gameStart) db.gameStart = Date.now();
    const state = () => ({ ok: true, users: db.users.map(u => ({ username: u.username, money: u.money, color: u.color })), lots: db.lots.slice(), serverTime: Date.now(), gameStart: db.gameStart, speed: SPEED });
    const save = () => store.set('ldv_mock', db);
    const name = String(p.username || '').trim().replace(/\s+/g, ' ');
    const find = () => db.users.find(u => u.username.toLowerCase() === name.toLowerCase());
    if (p.action === 'state') return res(state());
    if (p.action === 'register'){
      if (name.length < 2 || name.length > 16) return res({ ok:false, code:'NAME_LEN', error:'Tên phải dài 2–16 ký tự' });
      if (String(p.password||'').length < 4) return res({ ok:false, code:'PASS_LEN', error:'Mật khẩu ít nhất 4 ký tự' });
      if (find()) return res({ ok:false, code:'NAME_TAKEN', error:'Tên này đã có người dùng' });
      const u = { username: name, pass: p.password, token: Math.random().toString(36).slice(2), money: START_MONEY, color: MOCK_COLORS[db.users.length % MOCK_COLORS.length] };
      db.users.push(u); save();
      return res(Object.assign(state(), { me: { username: u.username, token: u.token } }));
    }
    if (p.action === 'login'){
      const u = find();
      if (!u) return res({ ok:false, code:'NO_USER', error:'Không tìm thấy tài khoản' });
      if (u.pass !== p.password) return res({ ok:false, code:'BAD_PASS', error:'Sai mật khẩu' });
      return res(Object.assign(state(), { me: { username: u.username, token: u.token } }));
    }
    if (p.action === 'buy'){
      const u = db.users.find(u => u.username === p.username && u.token === p.token);
      if (!u) return res({ ok:false, code:'AUTH', error:'Phiên đăng nhập hết hạn, hãy đăng nhập lại' });
      const dir = p.dir === 'v' ? 'v' : 'h', cs = cellsOf(+p.x, +p.y, dir);
      if (!cs.every(c => c[0] >= 0 && c[1] >= 0 && c[0] < N && c[1] < N)) return res({ ok:false, code:'OUT', error:'Lô nằm ngoài bản đồ' });
      if (!sameBlock(+p.x, +p.y, dir)) return res({ ok:false, code:'ROAD', error:'Lô không được nằm vắt qua đường' });
      const taken = {};
      db.lots.forEach(l => cellsOf(l.x, l.y, l.dir).forEach(c => taken[c] = l.owner));
      for (const c of cs) if (taken[c]) return res(Object.assign(state(), { ok:false, code:'TAKEN', owner: taken[c], error:'Lô đã có chủ — ' + taken[c] + ' mua trước rồi' }));
      const kind = BUILD[p.kind] ? p.kind : 'house';
      const price = cs.reduce((s, c) => s + cellPrice(c[0], c[1]), 0) + BUILD[kind].cost;
      if (u.money < price) return res(Object.assign(state(), { ok:false, code:'MONEY', price, error:'Không đủ tiền (cần $' + price + 'K)' }));
      db.lots.push({ id: Math.random().toString(36).slice(2, 10), x: +p.x, y: +p.y, dir, owner: u.username, price, boughtAt: Date.now(), kind, collectedAt: Date.now() });
      u.money -= price; save();
      return res(Object.assign(state(), { bought: { x: +p.x, y: +p.y, dir, price, kind } }));
    }
    if (p.action === 'collect'){
      const u = db.users.find(u => u.username === p.username && u.token === p.token);
      if (!u) return res({ ok:false, code:'AUTH', error:'Phiên đăng nhập hết hạn, hãy đăng nhập lại' });
      const now = Date.now(); let total = 0;
      db.lots.forEach(l => { if (l.owner !== u.username) return;
        total += lotRate(l, db.lots) * Math.min(CAP_DAYS, Math.max(0, (now - (l.collectedAt || l.boughtAt)) / DAY_MS)); l.collectedAt = now; });
      const amount = Math.floor(total); u.money += amount; save();
      return res(Object.assign(state(), { collected: amount }));
    }
    res({ ok:false, code:'BAD_CMD', error:'Lệnh không hợp lệ' });
  }, 200 + Math.random() * 200));
}

async function api(p){
  if (!API_URL) return mockApi(p);
  // text/plain để Apps Script không bị chặn CORS (không có preflight)
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(p), redirect: 'follow' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

let actx = null, muted = store.get('ldv_muted', false);
function beep(freqs, dur = .09, type = 'triangle', vol = .06){
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * dur;
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
    });
  } catch(_){}
}
const sfx = { coin: () => beep([988, 1319, 1568, 1976], .06, 'square', .05), tap: () => beep([700], .05), ok: () => beep([523, 659, 784, 1046], .08), bad: () => beep([220, 160], .14, 'sawtooth', .05) };

    m.position.set(x, y + h / 2, z); m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m;
  };
  /* kết cấu cửa sổ */
  function windowTex(base, lit){
    const c = document.createElement('canvas'); c.width = 64; c.height = 64; const g = c.getContext('2d');
    g.fillStyle = base; g.fillRect(0, 0, 64, 64);
    g.fillStyle = lit; for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) g.fillRect(6 + i * 32, 8 + j * 32, 20, 18);
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;

  /* toạ độ ô của khu Đất Vàng → thế giới */
  const cellX = x => Math.floor(x / 3) * P + (x % 3) + .5 - C;

    } else if (drag) {
      const p = [e.clientX, e.clientY];
      if (!drag.moved && Math.hypot(p[0] - drag.start[0], p[1] - drag.start[1]) > 8) drag.moved = true;
      if (drag.moved) {
        if (drag.rotate) { cam.yaw -= (p[0] - drag.last[0]) * .008; }
        else {
          const a = groundAt(drag.last[0], drag.last[1]), b = groundAt(p[0], p[1]);
          if (a && b) { cam.tx += a.x - b.x; cam.tz += a.z - b.z; }
        }
        updateCamera();
      }
      drag.last = p;
    }
  });
  const endPtr = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (drag && !drag.moved && ptrs.size === 0 && e.type === 'pointerup') onTap(drag.start[0], drag.start[1]);
    if (ptrs.size < 2) multi = null;
    if (ptrs.size === 0) drag = null;
  };
  el.addEventListener('pointerup', endPtr); el.addEventListener('pointercancel', endPtr);
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('wheel', e => { e.preventDefault(); cam.dist *= e.deltaY > 0 ? 1.1 : 1 / 1.1; updateCamera(); hideHint(); }, { passive: false });

  /* ---------- vòng lặp ---------- */
  const easeBack = k => { const c = 1.7; k = Math.min(1, k) - 1; return 1 + (c + 1) * k * k * k + c * k * k; };
  let last = performance.now();
  function loop(now){
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    cars.forEach(c => {
      c.t += c.speed * dt * c.dirn;
      if (c.t > span1) c.t = span0; if (c.t < span0) c.t = span1;
      const onRiver = !c.horiz && c.t > rz0 - .4 && c.t < rz1 + .4 && Math.abs(c.roadC - bridgeX) > 1;
      c.g.visible = !onRiver;
      if (c.horiz) c.g.position.set(c.t, 0, c.roadC); else c.g.position.set(c.roadC, 0, c.t);
    });
    for (const o of lotObjs.values()) if (o.born) {
      const k = (now - o.born) / 700;
      if (k >= 1) { o.born = 0; o.group.scale.set(1, 1, 1); }
      else { const s = Math.max(.02, easeBack(k)); o.group.scale.set(1, s, 1); }
    }
    boats.forEach(b => { b.g.position.x += b.v * dt; if (b.g.position.x > span1) b.g.position.x = span0; b.g.rotation.z = Math.sin(now / 600 + b.v * 9) * .05; });
    for (const o of lotObjs.values()) { const c = o.group.userData.coin; if (c && c.visible) c.position.y = c.userData.baseY + Math.abs(Math.sin(now / 300 + o.group.id)) * .25; }
    if (ghostObj) ghostObj.position.y = Math.sin(now / 250) * .03 + .03;
    selMat.opacity = .35 + Math.sin(now / 300) * .12;
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  fitDistance(); resize(); updateCamera();
  window.addEventListener('resize', () => { resize(); updateCamera(); });
  requestAnimationFrame(loop);
  $('loading').classList.add('hidden');
  cityReady = true;
  return {
    syncLots, syncSelection, pickCell, resize, syncCoins,
    relabel(){ labels.forEach(drawLabel); },
    rebuild(){ for (const o of lotObjs.values()) district.remove(o.group); lotObjs.clear(); syncLots(); },
    home(){ cam.tx = 0; cam.tz = 1; cam.yaw = Math.PI / 4; fitDistance(); updateCamera(); },
    setPrice(v){ S.showPrice = v; syncLots(); },
    lotObjs, cam, updateCamera, cellX,
    screenOf(x, y){ const v = new THREE.Vector3(cellX(x), .1, cellX(y)).project(camera); return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight]; }
  };
})();

/* ====== chọn lô ====== */
function clampSel(){
  if (!S.sel) return;
  S.sel.x = Math.max(0, Math.min(N - (S.dir === 'h' ? 2 : 1), S.sel.x));
  S.sel.y = Math.max(0, Math.min(N - (S.dir === 'v' ? 2 : 1), S.sel.y));
  // không cho lô vắt qua đường
  if (S.dir === 'h' && S.sel.x % 3 === 2) S.sel.x -= 1;
  if (S.dir === 'v' && S.sel.y % 3 === 2) S.sel.y -= 1;
}
const lotPrice = (x, y, dir, kind) => cellsOf(x, y, dir).reduce((s, c) => s + cellPrice(c[0], c[1]), 0) + BUILD[kind].cost;
function selStatus(){
  if (!S.sel) return { ok: false };
  if (S.sel.lot) return { ok: false, lot: S.sel.lot, why: '' };
  const own = cellOwner(), cs = cellsOf(S.sel.x, S.sel.y, S.dir);
  const price = lotPrice(S.sel.x, S.sel.y, S.dir, S.kind);
  const owner = cs.map(c => own[c]).find(Boolean);
  const me = meUser();
  if (owner) return { ok: false, price, lot: owner };
  if (me && me.money < price) return { ok: false, price, why: t('noMoney', { money: fmt(me.money) }) };
  return { ok: true, price };
}
function onTap(px, py){
  const c = City.pickCell(px, py);
  if (!c) { if (S.sel) { S.sel = null; City.syncSelection(); renderUI(); } return; }
  if (c.lot) { S.sel = { x: c.lot.x, y: c.lot.y, tx: c.lot.x, ty: c.lot.y, lot: c.lot }; sfx.tap(); City.syncSelection(); renderUI(); return; }
  if (S.sel && !S.sel.lot && S.sel.tx === c.x && S.sel.ty === c.y) { rotate(); return; }
  S.sel = { x: c.x, y: c.y, tx: c.x, ty: c.y }; clampSel(); sfx.tap(); City.syncSelection(); renderUI();
}
function rotate(){
  S.dir = S.dir === 'h' ? 'v' : 'h';
  if (S.sel && !S.sel.lot) { S.sel.x = S.sel.tx; S.sel.y = S.sel.ty; clampSel(); }
  sfx.tap(); City.syncSelection(); renderUI();
}

/* ====== mua ====== */
async function buy(){
  if (!S.me || !S.sel || S.busy) return;
  const st = selStatus(); if (!st.ok) { toast(st.why || t('cantBuy'), 'bad'); sfx.bad(); return; }
  S.busy = true; renderUI();
  const { x, y } = S.sel, dir = S.dir;
  try {
    const r = await api({ action: 'buy', username: S.me.username, token: S.me.token, x, y, dir, kind: S.kind });
    S.busy = false;
    if (r.ok) {
      S.sel = null; applyState(r);
      toast(t('built', { kind: BUILD[r.bought.kind].name, lot: lotName(x, y, dir), price: fmt(r.bought.price) }), 'good'); sfx.ok();
    } else {
      if (r.code === 'AUTH') logout();
      applyState(r); toast(errText(r), 'bad'); sfx.bad();
    }
  } catch (e) { S.busy = false; toast(t('lost'), 'bad'); sfx.bad(); }
  renderUI();
}

/* ====== thu tiền ====== */
async function collect(){
  if (!S.me || S.busy) return;
  S.busy = true; renderUI();
  try {
    const r = await api({ action: 'collect', username: S.me.username, token: S.me.token });
    S.busy = false;
    if (r.ok) { applyState(r); if (r.collected > 0) { toast(t('collected', { money: fmt(r.collected) }), 'good'); sfx.coin(); } else toast(t('nothing')); }
    else { if (r.code === 'AUTH') logout(); toast(errText(r), 'bad'); sfx.bad(); }
  } catch (e) { S.busy = false; toast(t('lost'), 'bad'); }
  renderUI();
}

/* ====== giao diện ====== */
function renderUI(){
  const me = meUser();
  $('money').textContent = me ? fmt(me.money) : '—';
  const myLots = S.me ? S.lots.filter(l => l.owner === S.me.username) : [];
  const myInc = myLots.reduce((a, l) => a + lotRate(l, S.lots), 0);
  $('title').textContent = t(myLots.length >= 3 ? 't2' : myLots.length ? 't1' : 't0') + ' · ' + (myLots.length ? '📈 ' + t('perDay', { money: fmt(myInc) }) : t('lots', { n: 0 }));
  // đồng hồ game theo máy chủ
  if (S.gameStart) {
    const gd = new Date(Date.UTC(2026, 0, 1) + (serverNow() - S.gameStart) * SPEED);
    const dd = String(gd.getUTCDate()).padStart(2, '0'), mm = String(gd.getUTCMonth() + 1).padStart(2, '0');
    const hh = String(gd.getUTCHours()).padStart(2, '0'), mi = String(gd.getUTCMinutes()).padStart(2, '0');
    const dayIdx = Math.floor((serverNow() - S.gameStart) / DAY_MS), winter = [11, 0, 1].includes(gd.getUTCMonth());
    const wx = (winter ? ['sunny', 'cloudy', 'snow', 'snow'] : ['sunny', 'sunny', 'cloudy', 'rain'])[hashN('w' + dayIdx) % 4];
    $('clock').textContent = `📅 ${LANG === 'vi' ? dd + '/' + mm : mm + '/' + dd}/${gd.getUTCFullYear()} · ${hh}:${mi} · ${t(wx)}`;
  }
  // tiền chờ thu
  const pend = myLots.reduce((a, l) => a + pendingOf(l), 0);
  const isFull = myLots.length && myLots.every(l => (serverNow() - l.collectedAt) / DAY_MS >= CAP_DAYS);
  $('collectBtn').classList.toggle('hidden', !S.me || !myLots.length);
  if (S.me && myLots.length) $('hint').classList.add('hidden');
  $('collectAmt').textContent = '+' + fmt(Math.floor(pend * 10) / 10);
  $('collectSub').textContent = isFull ? t('full') : t('collect');
  $('collectBtn').disabled = pend < 1 || S.busy;
  if (cityReady) City.syncCoins();
  $('meName').textContent = S.me ? S.me.username : t('profile');
  $('langBtn').textContent = LANG === 'vi' ? 'EN' : 'VI'; $('langBtn2').textContent = t('lang');
  const ago = S.lastSync ? Math.round((Date.now() - S.lastSync) / 1000) : null;
  $('online').textContent = !S.online ? t('offline') : ago == null ? t('connecting') : t('players', { n: S.users.length }) + (ago > 15 ? ' · ' + ago + 's' : '');
  $('syncDot').classList.toggle('off', !S.online);
  const st = selStatus();
  $('rotBtn').textContent = t(S.dir === 'h' ? 'wide' : 'tall');
  if (S.sel && st.lot) {
    $('selTitle').textContent = t('ownedTitle', { icon: BUILD[st.lot.kind].icon, kind: BUILD[st.lot.kind].name, owner: st.lot.owner });
    const nb = neighborsOf(st.lot, S.lots).length;
    $('selSub').textContent = t('ownedSub', { lot: lotName(st.lot.x, st.lot.y, st.lot.dir), price: fmt(st.lot.price) }) + ' · ' + t('perDay', { money: fmt(lotRate(st.lot, S.lots)) }) + (nb ? ' (' + t('nbBonus', { n: nb }) + ')' : '');
  } else if (S.sel) {
    $('selTitle').textContent = t('lotTitle', { lot: lotName(S.sel.x, S.sel.y, S.dir), price: fmt(st.price) });
    const proj = lotRate({ id: '_p', x: S.sel.x, y: S.sel.y, dir: S.dir, kind: S.kind }, S.lots);
    $('selSub').textContent = st.ok ? t('projected', { money: fmt(proj) }) + ' · ' + t('free', { kind: BUILD[S.kind].name }) : st.why;
  } else {
    $('selTitle').textContent = t('pickTitle');
    $('selSub').textContent = t('pickSub');
  }
  $('buyBtn').disabled = !S.sel || !st.ok || S.busy;
  $('buyBtn').textContent = t(S.busy ? 'buying' : 'buy');
  document.querySelectorAll('.kind').forEach(b => b.classList.toggle('on', b.dataset.k === S.kind));
}

let openPop = null;
function fillPop(kind){
  const p = $('pop'); if (!p) return;
  const L = p.querySelector('.list'); let html = '';
  const av = name => `<span class="av" style="background:${colorOf(name)}">${esc(name.charAt(0).toUpperCase())}</span>`;
  if (kind === 'rank') {
    const rows = S.users.map(u => {
      const lots = S.lots.filter(l => l.owner === u.username);
      return { u, n: lots.length, inc: lots.reduce((s, l) => s + lotRate(l, S.lots), 0), total: u.money + lots.reduce((s, l) => s + l.price, 0) };
    }).sort((a, b) => b.total - a.total);
    html = rows.map((r, i) => `<div class="item"><b>${i + 1}</b>${av(r.u.username)}<span>${esc(r.u.username)}${S.me && r.u.username === S.me.username ? ' ' + t('you') : ''}<br><small style="color:var(--muted)">${t('rankSub', { n: r.n, money: fmt(r.u.money), inc: fmt(r.inc) })}</small></span><span class="r">${fmt(r.total)}</span></div>`).join('') || `<div class="item">${t('noPlayers')}</div>`;
  } else {
    const lots = S.lots.filter(l => kind === 'log' || (S.me && l.owner === S.me.username)).sort((a, b) => b.boughtAt - a.boughtAt);
    html = lots.map(l => `<div class="item" data-goto="${l.id}">${av(l.owner)}<span>${BUILD[l.kind].icon} ${esc(l.owner)} · <b>${lotName(l.x, l.y, l.dir)}</b><br><small style="color:var(--muted)">${BUILD[l.kind].name} · ${new Date(l.boughtAt).toLocaleString(LANG === 'vi' ? 'vi-VN' : 'en-US', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' })}</small></span><span class="r">${fmt(l.price)}</span></div>`).join('')
      || `<div class="item">${t(kind === 'mine' ? 'noMine' : 'noDeals')}</div>`;
  }
  L.innerHTML = html;
  L.querySelectorAll('[data-goto]').forEach(it => it.onclick = () => {
    const l = S.lots.find(l => l.id === it.dataset.goto); if (!l) return;
    closePop(); City.cam.tx = City.cellX(l.x) + .5; City.cam.tz = City.cellX(l.y) + .5; City.cam.dist = 9; City.updateCamera();
    S.sel = { x: l.x, y: l.y, tx: l.x, ty: l.y, lot: l }; City.syncSelection(); renderUI();
  });
}
const POP_TITLES = { rank: 'popRank', log: 'popLog', mine: 'popMine' };
function showPop(kind){
  closePop(); openPop = kind;
  const d = document.createElement('div'); d.className = 'pop'; d.id = 'pop';
  d.innerHTML = `<div class="card"><h2>${t(POP_TITLES[kind])}<button aria-label="Close">✕</button></h2><div class="list"></div></div>`;
  d.addEventListener('click', e => { if (e.target === d) closePop(); });
  d.querySelector('h2 button').onclick = closePop;
  document.body.appendChild(d); fillPop(kind);
}
function showHowto(){
  closePop(); openPop = 'menu';
  const d = document.createElement('div'); d.className = 'pop'; d.id = 'pop';
  d.innerHTML = `<div class="card"><h2>${t('howto')}<button aria-label="Close">✕</button></h2><div class="list" style="line-height:1.35">${t('howtoBody')}</div></div>`;
  d.addEventListener('click', e => { if (e.target === d) closePop(); });
  document.body.appendChild(d); d.querySelector('h2 button').onclick = closePop;
}
function closePop(){ const p = $('pop'); if (p) p.remove(); openPop = null; }
document.querySelectorAll('[data-pop]').forEach(b => b.addEventListener('click', () => showPop(b.dataset.pop)));

let toastT;
function toast(msg, kind){
  const t = $('toast'); t.textContent = msg; t.className = 'show ' + (kind || '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 2600);
}
let hintGone = false;
function hideHint(){ if (hintGone) return; hintGone = true; setTimeout(() => $('hint').style.opacity = 0, 1500); setTimeout(() => $('hint').classList.add('hidden'), 2000); }

$('rotBtn').addEventListener('click', rotate);
$('collectBtn').addEventListener('click', collect);
$('buyBtn').addEventListener('click', buy);
document.querySelectorAll('.kind').forEach(b => b.addEventListener('click', () => { S.kind = b.dataset.k; sfx.tap(); City.syncSelection(); renderUI(); }));
$('priceBtn').addEventListener('click', () => { City.setPrice(!S.showPrice); $('priceBtn').classList.toggle('on', S.showPrice); });
$('homeBtn').addEventListener('click', () => City.home());
function showMenu(){
  closePop();
  const d = document.createElement('div'); d.className = 'pop'; d.id = 'pop';
  d.innerHTML = `<div class="card"><h2>👤 ${S.me ? esc(S.me.username) : t('settings')}<button aria-label="Close">✕</button></h2>
    <button class="btn rot" id="mHow" style="margin-bottom:8px">${t('howto')}</button>
    <button class="btn rot" id="mLang" style="margin-bottom:8px">${t('lang')}</button>
    <button class="btn rot" id="mMute" style="margin-bottom:8px">${t(muted ? 'soundOn' : 'soundOff')}</button>
    <button class="btn rot" id="mOut">${t('logout')}</button></div>`;
  d.addEventListener('click', e => { if (e.target === d) closePop(); });
  document.body.appendChild(d);
  d.querySelector('h2 button').onclick = closePop;
  $('mMute').onclick = () => { muted = !muted; store.set('ldv_muted', muted); closePop(); };
  $('mOut').onclick = () => { closePop(); logout(); };
  $('mLang').onclick = () => { closePop(); setLang(LANG === 'vi' ? 'en' : 'vi'); };
  $('mHow').onclick = showHowto;
}
$('menuBtn').addEventListener('click', showMenu);
$('langBtn').addEventListener('click', () => setLang(LANG === 'vi' ? 'en' : 'vi'));
$('langBtn2').addEventListener('click', () => setLang(LANG === 'vi' ? 'en' : 'vi'));
$('meBtn').addEventListener('click', showMenu);

/* ====== đăng nhập ====== */
async function auth(action){
  const username = $('uName').value.trim(), password = $('uPass').value;
  $('loginErr').textContent = '';
  if (!username || !password) { $('loginErr').textContent = t('needBoth'); return; }
  $('loginBtn').disabled = $('regBtn').disabled = true;
  try {
    const r = await api({ action, username, password });
    if (!r.ok) { $('loginErr').textContent = errText(r); sfx.bad(); }
    else {
      S.me = r.me; store.set('ldv_me', r.me);
      $('login').classList.add('hidden'); $('uPass').value = '';
      S.known = null; applyState(r); City.syncLots(); sfx.ok();
      toast(action === 'register' ? t('welcomeNew', { name: r.me.username, money: fmt(START_MONEY) }) : t('welcomeBack', { name: r.me.username }), 'good');
    }
  } catch (e) { $('loginErr').textContent = t('noServer'); }
  $('loginBtn').disabled = $('regBtn').disabled = false;
}
$('loginBtn').addEventListener('click', () => auth('login'));
$('regBtn').addEventListener('click', () => auth('register'));
$('uPass').addEventListener('keydown', e => { if (e.key === 'Enter') auth('login'); });
function logout(){
  S.me = null; store.del('ldv_me'); S.sel = null;
  $('login').classList.remove('hidden'); City.syncLots(); City.syncSelection(); renderUI();
}

/* ====== bàn phím ====== */
window.addEventListener('keydown', e => {
  if (!S.me || document.activeElement.tagName === 'INPUT') return;
  const mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (mv) {
    e.preventDefault();
    if (!S.sel || S.sel.lot) S.sel = { x: 4, y: 4, tx: 4, ty: 4 };
    S.sel.tx = Math.max(0, Math.min(N - 1, S.sel.tx + mv[0])); S.sel.ty = Math.max(0, Math.min(N - 1, S.sel.ty + mv[1]));
    S.sel.x = S.sel.tx; S.sel.y = S.sel.ty; clampSel(); City.syncSelection(); renderUI();
  } else if (e.key === 'r' || e.key === 'R') rotate();
  else if (e.key === 'k' || e.key === 'K') { const ks = Object.keys(BUILD); S.kind = ks[(ks.indexOf(S.kind) + 1) % ks.length]; City.syncSelection(); renderUI(); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); buy(); }
  else if (e.key === 'Escape') { S.sel = null; City.syncSelection(); renderUI(); }
});
document.addEventListener('gesturestart', e => e.preventDefault());

/* ====== khởi động ====== */
window.LDV = { refresh, logout, setLang };
applyStaticText();
if (!API_URL) $('mockbar').classList.remove('hidden');
if (S.me) $('login').classList.add('hidden');
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => City.rebuild());
renderUI(); City.resize(); refresh();
setInterval(() => { if (!document.hidden && S.me) refresh(); }, POLL_MS);
setInterval(renderUI, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
